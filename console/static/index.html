<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大肥鱼 · 控制台</title>
  <link rel="stylesheet" href="/app.css" />
  <script>
    // 首帧之前把主题写好，避免闪一下
    try {
      var t = localStorage.getItem('dsb-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="page-marks"><i></i><i></i></div>

  <header class="top">
    <div>
      <p class="rl-label">RHINE LAB · DEEPSEA BEAST</p>
      <h1>大肥鱼 · 控制台</h1>
    </div>
    <div class="right">
      <span class="rl-meta" id="stamp">—</span>
      <span class="state rl-meta"><i class="dot" id="dot-core"></i><span id="txt-core">CORE</span></span>
      <button class="btn" id="theme-btn" type="button">THEME</button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav">
      <!-- 一级：层 -->
      <div class="layers" id="layers"></div>
      <!-- 二级：当前层里的子系统 -->
      <div class="subs" id="subs"></div>
    </nav>

    <main id="main">
      <div id="loading" class="empty">读取中…</div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
