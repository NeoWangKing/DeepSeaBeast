<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大肥鱼 · 控制台</title>
  <link rel="stylesheet" href="/app.css" />
  <script>
    // 首帧之前把主题写好，避免闪一下
    try {
      var t = localStorage.getItem('dsb-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="page-marks"><i></i><i></i></div>

  <header class="top">
    <div>
      <p class="rl-label">RHINE LAB · DEEPSEA BEAST</p>
      <h1>大肥鱼 · 控制台</h1>
    </div>
    <div class="right">
      <span class="rl-meta" id="stamp">—</span>
      <span class="state rl-meta"><i class="dot" id="dot-core"></i><span id="txt-core">CORE</span></span>
      <button class="btn" id="theme-btn" type="button">THEME</button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav" id="nav">
      <div class="group">
        <p class="rl-label">CORE / 核心</p>
        <a class="item" href="#overview" data-sec="overview"><span>总览</span><span class="en">OVERVIEW</span></a>
        <a class="item" href="#gate" data-sec="gate"><span>门控</span><span class="en">GATE</span></a>
        <a class="item" href="#turn" data-sec="turn"><span>回合</span><span class="en">TURN</span></a>
        <a class="item" href="#memory" data-sec="memory"><span>记忆</span><span class="en">MEMORY</span></a>
        <a class="item" href="#todos" data-sec="todos"><span>待办</span><span class="en">TODOS</span></a>
        <a class="item" href="#send" data-sec="send"><span>发送</span><span class="en">SEND</span></a>
        <a class="item" href="#pacing" data-sec="pacing"><span>节奏</span><span class="en">PACING</span></a>
      </div>
      <div class="group">
        <p class="rl-label">NEXT / 后续</p>
        <a class="item" href="#pending" data-sec="pending"><span>通道层</span><span class="en">CHANNELS</span></a>
        <a class="item" href="#pending" data-sec="pending"><span>插件层</span><span class="en">PLUGINS</span></a>
        <a class="item" href="#pending" data-sec="pending"><span>运维</span><span class="en">OPS</span></a>
      </div>
    </nav>

    <main id="main">
      <div id="loading" class="empty">读取中…</div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
