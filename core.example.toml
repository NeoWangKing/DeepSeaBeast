# 核心配置。生产环境里这个文件不进 git（用 core.example.toml 当模板）。

data_dir = "data"
owner_ids = [3245938285]   # 业主账号（私聊/特权判断用）

[onebot]
host = "127.0.0.1"
port = 6200
# 只接受这个机器人账号的事件（留空 = 不校验）
allow_self_ids = [3237702352]

[log]
level = "INFO"


[jobs]
# 后台任务总开关（插件在 hello 里声明 jobs，这里可以整体关掉）
enabled = true

[turn]
# 一次回复（回合）的硬上限：防止死循环/烧 token；被打断或超限就停
max_tokens = 3000          # 单回合**输出** token 上限
max_seconds = 45
max_rounds = 6
max_sends = 4
wait_recheck_sec = 5      # 她说"先等等"时，多久后再决定一次

[pacing]
# 发言节奏：多条气泡之间的间隔 ≈ base_sec + 上一条字数 × sec_per_char（封顶 max_sec）
# 首条不等待（模型思考时间已经够久）；jitter 是 ±抖动，避免机械感
enabled = true
base_sec = 1.2
sec_per_char = 0.035
max_sec = 4.0
jitter = 0.2

[gate]
force_mode = "off"              # off=只认 @；peak/offpeak=按概率接话
allowed_groups = [1109525246]   # 留空 = 所有群都管
at_only_groups = [1109525246]
private_owner_only = false   # false = 私聊都理（靠频率限制防刷）
merge_window_sec = 10
typing_wait_sec = 8         # 每说一句就重新计时
typing_max_wait_sec = 40    # 但一串话最多等这么久
burst_suppress_sec = 30
min_interval_sec = 8
max_auto_per_hour = 30
reply_probability = 0.2
offpeak_probability = 0.25

[llm]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
# key 放文件里（不进 git）；也可用 api_key_env 指定环境变量
api_key_file = "/home/neowang/Documents/Deepseek_APIs/qq_key1"
temperature = 0.9
max_tokens = 900
timeout = 60

# 插件：每个是一个独立进程（stdio + JSON 行协议）
[[plugins]]
name = "echo_plugin"
command = [".venv/bin/python", "plugins/echo_plugin/main.py"]
timeout = 10

[memory]
# 上下文总预算（估算 token）：超了先丢低优先级素材，规则/场景永不裁
budget_tokens = 6000

[[plugins]]
name = "personas"
command = [".venv/bin/python", "plugins/personas/main.py"]
timeout = 10
priority = 5
can_persona = true

# 通道（可以同时开多个）
[adapters.cli]
enabled = true

[adapters.onebot]
enabled = true
host = "127.0.0.1"
port = 6199
allow_self_ids = [3237702352]

[[plugins]]
name = "memory"
command = [".venv/bin/python", "plugins/memory/main.py"]
timeout = 30
priority = 10
max_concurrency = 2

[[plugins]]
name = "stickers"
command = [".venv/bin/python", "plugins/stickers/main.py"]
timeout = 20
priority = 30
max_concurrency = 2
