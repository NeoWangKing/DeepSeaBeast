# 核心配置。生产环境里这个文件不进 git（用 core.example.toml 当模板）。

[onebot]
host = "127.0.0.1"
port = 6200
# 只接受这个机器人账号的事件（留空 = 不校验）
allow_self_ids = [3237702352]

[log]
level = "INFO"

data_dir = "data"
owner_ids = [3245938285]   # 业主 QQ（私聊/特权判断用）

[gate]
force_mode = "off"              # off=只认 @；peak/offpeak=按概率接话
allowed_groups = [1109525246]   # 留空 = 所有群都管
at_only_groups = [1109525246]
private_owner_only = true
merge_window_sec = 10
burst_suppress_sec = 30
min_interval_sec = 8
max_auto_per_hour = 30
reply_probability = 0.2
offpeak_probability = 0.25

[llm]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
# key 放文件里（不进 git）；也可用 api_key_env 指定环境变量
api_key_file = "/home/neowang/Documents/Deepseek_APIs/qq_key1"
temperature = 0.9
max_tokens = 900
timeout = 60

# 插件：每个是一个独立进程（stdio + JSON 行协议）
[[plugins]]
name = "echo_plugin"
command = [".venv/bin/python", "plugins/echo_plugin/main.py"]
timeout = 10
