# 服务器实例配置模板（不含密钥明文；key 放 /opt/deepsea/.secrets/deepseek.key）
# 安装：sudo -u astrbot cp deploy/server.core.toml /opt/deepsea/core.toml

data_dir = "data"
owner_ids = [3245938285]   # 业主账号（私聊/特权判断用）

[log]
level = "INFO"


[adapters.cli]
enabled = false          # 服务器上不开 CLI（systemd 的 stdin 会立刻 EOF）

[adapters.onebot]
# 发送后回读核对：retcode=0 只代表"接口收下了"，回读才确认消息真的存在
verify_send = true
verify_timeout_ms = 3000
enabled = true
host = "127.0.0.1"
port = 6199
allow_self_ids = [3237702352]

[adapters.tcp]
self_name = "大肥鱼"          # 在这儿她叫什么（提示词里会用）
enabled = true                    # telnet 127.0.0.1:4000（只绑回环，不开公网）
host = "127.0.0.1"
port = 4000
token = ""                        # 留空=不需要密码（回环访问）

[adapters.socket]
enabled = true                    # SSH 上去 chat.py 直接和运行中的核心聊
path = "/tmp/deepsea.sock"

[jobs]
# 后台任务总开关（插件在 hello 里声明 jobs，这里可以整体关掉）
enabled = true


[todos]
max_open = 12          # 每个会话最多压几件未完成的事（满了她会说"忙不过来"）
stale_days = 7         # 完成/作废的条目留几天
remind_per_day = 3     # 每个会话每天最多主动提醒几次
tick_sec = 60          # 多久扫一次到点的待办

[turn]
# 一次回复（回合）的硬上限：防止死循环/烧 token；被打断或超限就停
max_tokens = 3000          # 单回合**输出** token 上限
max_seconds = 45
max_rounds = 8
max_sends = 4
wait_recheck_sec = 5      # 她说"先等等"时，多久后再决定一次

[pacing]
# 发言节奏：多条气泡之间的间隔 ≈ base_sec + 上一条字数 × sec_per_char（封顶 max_sec）
# 首条不等待（模型思考时间已经够久）；jitter 是 ±抖动，避免机械感
enabled = true
base_sec = 1.2
sec_per_char = 0.035
max_sec = 4.0
jitter = 0.2

[gate]
force_mode = "off"                 # off = 只认 @
allowed_groups = [1109525246]      # 先只在调试群跑；确认稳定后放开
at_only_groups = [1109525246]
private_owner_only = false   # false = 私聊都理（靠频率限制防刷）
merge_window_sec = 10
typing_wait_sec = 8         # 每说一句就重新计时
typing_max_wait_sec = 40    # 但一串话最多等这么久
burst_suppress_sec = 30
min_interval_sec = 8
max_auto_per_hour = 30
reply_probability = 0.2
offpeak_probability = 0.25

[llm]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_file = "/opt/deepsea/.secrets/deepseek.key"
temperature = 0.9
max_tokens = 900
timeout = 60

[memory]
budget_tokens = 6000

[[plugins]]
name = "echo_plugin"
command = [".venv/bin/python", "plugins/echo_plugin/main.py"]
timeout = 10

[[plugins]]
name = "personas"
command = [".venv/bin/python", "plugins/personas/main.py"]
timeout = 10
priority = 5
can_persona = true

[[plugins]]
name = "memory"
command = [".venv/bin/python", "plugins/memory/main.py"]
timeout = 30
priority = 10
max_concurrency = 2

[[plugins]]
name = "stickers"
command = [".venv/bin/python", "plugins/stickers/main.py"]
timeout = 20
priority = 30
max_concurrency = 2

[send]
max_retries = 2          # 明确失败时最多重试几次（未确认的绝不重发）
retry_backoff_sec = 0.8  # 首次重试前等多久，之后翻倍

[adapters.breamer]
self_name = "大肥鱼"          # 房间里别人这么叫她
enabled = false              # 自己搭的 TCP 聊天室（breamer server）
host = "127.0.0.1"
port = 6969
token_file = ".secrets/breamer.token"   # 口令文件，别写进仓库
room_key = "breamer"
room_name = "聊天室"

[adapters.teamspeak]
enabled = false               # TS6 的 SSH Query（10022，只绑回环）
host = "127.0.0.1"
port = 10022
username = "serveradmin"
password_file = ".secrets/teamspeak_query.pass"
voice_port = 9987             # 哪个虚拟服务器
channels = []                 # 要接的频道 id，空 = 全部
nickname = "大肥鱼"
room_prefix = "ts"
follow_humans = true          # TS 频道文字只投给"在频道里"的客户端 → 跟着人走
follow_interval = 15          # 多久看一次该待在哪个频道

[[plugins]]
name = "jargon"
command = [".venv/bin/python", "plugins/jargon/main.py"]
timeout = 15
priority = 20
max_concurrency = 2
